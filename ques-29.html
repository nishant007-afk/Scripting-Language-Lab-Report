<!DOCTYPE html>
<html>
<head>
  <style>
    #container { display: grid; grid-template-columns: repeat(11, 50px); gap: 2px; }
    .num-box { width: 50px; height: 50px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Number Grid (0 to 100)</h3>
  <div id="container"></div>

  <script>
    function isPrime(num) {
      if (num < 2) return false;
      for (var i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
      }
      return true;
    }

    var container = document.getElementById('container');
    for (var i = 0; i <= 100; i++) {
      var div = document.createElement('div');
      div.className = 'num-box';
      div.textContent = i;
      
      if (isPrime(i)) {
        div.style.backgroundColor = 'red';
      } else if (i % 2 === 0) {
        div.style.backgroundColor = 'green';
      } else {
        div.style.backgroundColor = 'yellow';
      }
      
      container.appendChild(div);
    }
  </script>
</body>
</html>
