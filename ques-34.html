<!DOCTYPE html>
<html>
<body>
  <h3>Analog Clock</h3>
  <canvas id="clockCanvas" width="200" height="200" style="background-color:#333; border-radius:50%;"></canvas>

  <script>
    var canvas = document.getElementById("clockCanvas");
    var ctx = canvas.getContext("2d");
    var radius = canvas.height / 2;
    ctx.translate(radius, radius);
    radius = radius * 0.90;

    setInterval(drawClock, 1000);

    function drawClock() {
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.fillStyle = "white";
      ctx.fill();

      var now = new Date();
      var hour = now.getHours();
      var minute = now.getMinutes();
      var second = now.getSeconds();

      hour = (hour % 12) * Math.PI / 6 + (minute * Math.PI / (6 * 60));
      drawHand(ctx, hour, radius * 0.5, 6);
      
      minute = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
      drawHand(ctx, minute, radius * 0.8, 4);

      second = (second * Math.PI / 30);
      drawHand(ctx, second, radius * 0.9, 2);
    }

    function drawHand(ctx, pos, length, width) {
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.moveTo(0, 0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
    }
  </script>
</body>
</html>
