<!DOCTYPE html>
<html>
<body>
  <h3>Check if String is Blank</h3>
  <input type="text" id="txtInput">
  <button onclick="checkBlank()">Check</button>
  <div id="result"></div>

  <script>
    function checkBlank() {
      var val = document.getElementById("txtInput").value;
      var isBlank = val.trim().length === 0;
      document.getElementById("result").innerText = "Is Blank: " + isBlank;
    }
  </script>
</body>
</html>
