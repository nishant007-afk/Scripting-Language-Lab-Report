<!DOCTYPE html>
<html>
<body>
  <h3>Display Colors with Suffixes</h3>
  <button onclick="showColors()">Show Choices</button>
  <div id="result"></div>

  <script>
    function showColors() {
      var color = ["Blue", "Green", "Red", "Orange", "Violet", "Indigo", "Yellow"];
      var o = ["th", "st", "nd", "rd"];
      var output = "";
      
      for (var i = 0; i < color.length; i++) {
        var num = i + 1;
        var suffix = (num <= 3) ? o[num] : o[0];
        output += `"${num}${suffix} choice is ${color[i]}."<br>`;
      }
      
      document.getElementById("result").innerHTML = output;
    }
  </script>
</body>
</html>
